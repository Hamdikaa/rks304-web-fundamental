<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center py-10 px-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-1">Daftar Akun</h1>
    <p class="text-center text-gray-500 text-sm mb-6">Lengkapi data berikut untuk mendaftar</p>

    <!-- action diarahkan ke dashboard.html sesuai soal -->
    <form id="registerForm" action="dashboard.html" method="get" novalidate class="space-y-4">

      <!-- Username -->
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Minimal 3 karakter"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="usernameError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Minimal 8 karakter"
            class="w-full px-3 py-2 pr-16 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button type="button" id="togglePassword"
            class="absolute inset-y-0 right-0 px-3 text-xs font-semibold text-blue-600 hover:text-blue-800">
            Lihat
          </button>
        </div>
        <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Nama -->
      <div>
        <label for="nama" class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
        <input type="text" id="nama" name="nama" autocomplete="name" placeholder="Nama lengkap"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="namaError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Tanggal Lahir -->
      <div>
        <label for="tanggalLahir" class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir" autocomplete="bday"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="tanggalLahirError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Alamat -->
      <div>
        <label for="alamat" class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" autocomplete="street-address" placeholder="Alamat lengkap"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <p id="alamatError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Nomor Telpon -->
      <div>
        <label for="telpon" class="block text-sm font-medium text-gray-700 mb-1">Nomor Telpon</label>
        <input type="tel" id="telpon" name="telpon" autocomplete="tel" placeholder="Contoh: 628123456789"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <p id="telponError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
        Daftar
      </button>

      <p class="text-center text-sm text-gray-500">
        Sudah ada data?
        <a href="dashboard.html" class="text-blue-600 hover:underline font-medium">Lihat dashboard</a>
      </p>
    </form>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
