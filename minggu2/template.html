<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DimasGunshopp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="flex min-h-screen flex-col md:flex-row">

    <!-- Navigasi -->
    <aside class="border-b border-slate-200 bg-white md:w-60 md:shrink-0 md:border-b-0 md:border-r">
      <div class="px-5 py-4">
        <span class="text-lg font-bold">DimasGunshopp</span>
      </div>
      <nav id="nav" class="flex gap-1 overflow-x-auto px-3 pb-3 md:flex-col md:pb-0">
        <a href="dashboard.html" data-match="dashboard" class="block whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Dashboard</a>
        <a href="products.html" data-match="products,produk" class="block whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Products</a>
        <a href="users.html" data-match="users" class="block whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Users</a>
        <a href="setting.html" data-match="setting" class="block whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100">Setting</a>
        <a href="index.html" class="block whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-medium text-rose-600 hover:bg-rose-50 md:mt-8">Logout</a>
      </nav>
    </aside>

    <div class="flex flex-1 flex-col">
      <!-- Header -->
      <header class="flex items-center justify-between bg-white px-6 py-3 shadow-sm">
        <span class="text-sm text-slate-500">Panel Admin</span>
        <span class="flex items-center gap-2 text-sm font-semibold">
          Halo, Admin
          <span class="grid h-8 w-8 place-items-center rounded-full bg-indigo-100 text-indigo-700">A</span>
        </span>
      </header>

      <!-- Konten utama -->
      <main class="flex-1 p-6 md:p-8">
        <!-- KONTEN:START -->
        <h1 class="text-2xl font-bold">Judul Halaman</h1>
        <p class="mt-2 max-w-prose text-slate-600">Ini adalah paragraf sampel. Ganti bagian ini dengan isi konten setiap halaman.</p>
        <!-- KONTEN:END -->
      </main>

      <!-- Footer -->
      <footer class="px-6 py-4 text-center text-xs text-slate-500">
        &copy; DimasGunshopp
      </footer>
    </div>
  </div>

  <script>
    // Tandai menu yang sedang aktif berdasarkan nama file
    document.querySelectorAll('#nav a[data-match]').forEach(a => {
      if (a.dataset.match.split(',').some(m => location.pathname.includes(m)))
        a.classList.add('bg-indigo-50', 'text-indigo-700', 'font-semibold');
    });
  </script>
</body>
</html>
