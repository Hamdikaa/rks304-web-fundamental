<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - TokoKu Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'DM Sans', system-ui, sans-serif; }</style>
</head>
<body class="flex min-h-screen items-center justify-center bg-indigo-600 p-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-slate-800">DimasGunshopp</h1>
    <p class="mt-1 text-sm text-slate-500">Silahkan Kelola dan Pilih Produk Yang Anda Inginkan.</p>

    <form action="dashboard.html" class="mt-6 space-y-4">
      <div>
        <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
        <input id="username" name="username" type="text" required
               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
      </div>
      <div>
        <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/30">
      </div>
      <button type="submit"
              class="w-full rounded-xl bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">Login</button>
    </form>
  </div>
</body>
</html>
